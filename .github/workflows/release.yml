# Publishes to PyPI on a version tag, using Trusted Publishing (OIDC) - no API token
# is ever stored in the repo. Configure once at
# https://pypi.org/manage/account/publishing/ with:
#   PyPI project: signal-map
#   Owner/repo:   <you>/signal-map
#   Workflow:     release.yml
#   Environment:  pypi
#
# Inert inside the host project (GitHub only reads .github/ at the repo root);
# it activates when this directory becomes its own repo. See PACKAGING.md.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # The OIDC token PyPI exchanges for a short-lived upload credential.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
