# Paths here are relative to the repo root this file sits at AFTER extraction
# (see PACKAGING.md). Inside the pointlessbutton repo this file is metadata only:
# nothing builds it, and the host project's own pyproject.toml is untouched.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seamcheck"
version = "0.8.0"
description = "Find the code your project no longer connects to - and the connections it only thinks it has. A frontend-to-backend seam checker with a visual map."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "dardameiz" }]
# What someone actually types when they have this problem. The second half is the honest
# framing of who this is for: people shipping code an assistant wrote, who need to know
# which of it is wired to anything.
keywords = [
  # The seam is the product; Django is the backend it currently reads. Ordered so the
  # first thing a search engine sees is what the tool is FOR, not what it happens to parse.
  "static-analysis", "dead-code", "unused-code", "connectivity", "code-map",
  "dependency-graph", "codebase-visualization", "frontend-backend", "api-contract",
  "django", "javascript", "css",
  "mcp", "mcp-server", "ai-code-review", "llm-generated-code", "vibe-coding",
  "agent-tools", "ci", "code-quality", "technical-debt",
]
# No "License :: OSI Approved ::" classifier: PEP 639 replaced it with the
# License-Expression field above, and PyPI rejects a distribution carrying both.
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Django",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]
# Nothing. Seamcheck reads six backends and only one of them is Django - requiring it to
# scan an Express repository was backwards. And for a DJANGO project it was worse than
# useless: seamcheck runs inside that project's own virtualenv, where Django is already
# installed, so a hard `django>=5.0` could try to UPGRADE a project running Django 4.2
# just because someone installed a linter.
dependencies = []

[project.optional-dependencies]
# Only for scanning a Django project, and only when the project does not already provide
# it - which it almost always does, since seamcheck runs inside its virtualenv.
django = ["django>=4.2"]
# Model extraction shells out to django-extensions' graph_models --json.
models = ["django-extensions>=4.0"]
# Exposes the scan to an agent over MCP.
mcp = ["mcp>=1.0"]
# Bundles a Node runtime so `pip install` alone is enough on a machine without one
# (the pyright precedent). The npm parsers still have to be present - see README.
node = ["nodejs-wheel-binaries>=20"]

[project.scripts]
seamcheck = "seamcheck.cli:main"
# Named so an agent's config is one word rather than a module path.
seamcheck-mcp = "seamcheck.mcp_server:main"

[project.urls]
Source = "https://github.com/dardameiz/seamcheck"
Issues = "https://github.com/dardameiz/seamcheck/issues"

[tool.hatch.build.targets.wheel]
packages = ["seamcheck"]
# The parser bundles are the wheel's whole reason for working: a pip install has no
# node_modules to resolve acorn or postcss against, so they ship inlined.
artifacts = ["seamcheck/js_tools/*.bundle.mjs", "seamcheck/css_tools/*.bundle.mjs"]
# Fixtures, tests and the host project's own triage file are not part of what an
# installing user needs; they stay in the sdist for contributors.
exclude = ["seamcheck/tests", "seamcheck/triage.json"]

[tool.hatch.build.targets.sdist]
include = ["seamcheck", "README.md", "LICENSE"]

[tool.ruff]
# Held to the package's own floor. With py312 here, UP038 and UP017 "fix" isinstance
# tuples into `X | Y` unions and timezone.utc into datetime.UTC - the second of which is
# 3.11 syntax, so the linter would reintroduce exactly what the floor forbids.
target-version = "py310"
line-length = 120  # matches the host project this is developed inside

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
# UP038 rewrites `isinstance(x, (A, B))` into `isinstance(x, A | B)`. Both are correct on
# the supported floor, but the tuple form runs on every Python there has ever been, and the
# union form is what pinned this package to 3.12 by accident once already.
ignore = ["UP038"]


[tool.pytest.ini_options]
# Django's own runner needs a project; pytest plus conftest.py does not, which is what
# lets someone clone this repo and run the suite without one.
testpaths = ["seamcheck/tests"]
